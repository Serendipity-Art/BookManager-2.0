<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · serendipity 图书管理系统</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 页面样式 -->
    <link rel="stylesheet" th:href="@{/static/css/login.css}">
    <!-- Bootstrap JS（defer，保证在 DOM 解析后执行） -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 登录逻辑 -->
    <script th:src="@{/static/js/login.js}"></script>
</head>
<body>

<main class="card auth-card">
    <div class="card-body">

        <!-- 头部：图标 + 标题 -->
        <div class="text-center mb-4">
            <div class="brand-icon"><i class="bi bi-book-half"></i></div>
            <h5 class="fw-bold mb-1">欢迎回来</h5>
            <p class="text-secondary small mb-0">请登录 serendipity 图书管理系统</p>
        </div>

        <!-- 错误提示区：默认隐藏，登录失败时显示 -->
        <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <!-- 登录表单 -->
        <form id="loginForm" novalidate>

            <!-- 用户名 -->
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">用户名</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="请输入用户名" autocomplete="username" required>
                    <div class="invalid-feedback">请输入用户名</div>
                </div>
            </div>

            <!-- 密码（带显示/隐藏切换） -->
            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">密码</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="请输入密码" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                            tabindex="-1" aria-label="显示或隐藏密码">
                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </button>
                    <div class="invalid-feedback">请输入密码</div>
                </div>
                <p th:if="${failure}">用户名和密码输入错误</p>
            </div>

            <!-- 记住我 + 忘记密码 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                    <label class="form-check-label small" for="rememberMe">记住我</label>
                </div>
                <a th:href="@{/forgot-password}" class="small text-decoration-none">忘记密码？</a>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn btn-auth w-100" id="submitBtn">
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                <span id="btnText">登 录</span>
            </button>
        </form>

        <!-- 注册入口 -->
        <div class="text-center mt-4">
            <span class="auth-divider-text">还没有账号？</span>
            <a  th:href="@{/register}" class="small text-decoration-none fw-semibold">立即注册</a>
        </div>

    </div>
</main>

<!-- 页脚版权 -->
<footer class="auth-footer">
    © <span id="year"></span> <strong>serendipity</strong> · 保留所有权利<br>
    本站一切内容、功能与规则的解释权归 <strong>serendipity</strong> 所有
</footer>

</body>
</html>
