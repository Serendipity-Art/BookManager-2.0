<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借阅记录 · serendipity 图书管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 公共样式 -->
    <link rel="stylesheet" th:href="@{/static/css/dashboard.css}">
    <!-- 本页专属样式 -->
    <link rel="stylesheet" th:href="@{/static/css/borrows.css}">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 公共脚本：侧边栏折叠 + #year -->
    <script defer th:src="@{/static/js/dashboard.js}"></script>
    <!-- 本页专属脚本 -->
    <script defer th:src="@{/static/js/borrows.js}"></script>
</head>
<body>

<!-- ===== 侧边栏 ===== -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-book-half"></i>
        <span>serendipity</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-link"><i class="bi bi-speedometer2"></i> 仪表盘</a>
        <a th:href="@{/books}" class="nav-link"><i class="bi bi-journal-bookmark"></i> 图书管理</a>
        <a th:href="@{/borrows}" class="nav-link active"><i class="bi bi-arrow-left-right"></i> 借阅记录</a>
        <a th:href="@{/users}" class="nav-link"><i class="bi bi-people"></i> 用户管理</a>
        <a th:href="@{/settings}" class="nav-link"><i class="bi bi-gear"></i> 系统设置</a>
    </nav>
</aside>

<div class="main-wrapper" id="mainWrapper">
    <!-- ===== 顶栏 ===== -->
    <header class="topbar">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <div class="ms-auto d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary position-relative">
                <i class="bi bi-bell"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
            </button>
            <div class="dropdown">
                <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${user != null ? user.username : '管理员'}">管理员</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/settings}">个人设置</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" th:href="@{/logout}">退出登录</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- ===== 内容区 ===== -->
    <main class="content">

        <!-- 标题 + 新增按钮 -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="mb-1">借阅记录</h4>
                <p class="text-secondary small mb-0">
                    共 <strong id="borrowCount">0</strong> 条记录
                </p>
            </div>
            <button type="button" class="btn btn-primary" id="btnAddBorrow">
                <i class="bi bi-plus-lg me-1"></i> 新增借阅
            </button>
        </div>

        <!-- 搜索栏（纯前端过滤） -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body py-2">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput"
                           class="form-control border-start-0"
                           placeholder="按书名 / 借阅人搜索...">
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="card border-0 shadow-sm" id="loadingState">
            <div class="card-body text-center py-5 text-secondary">
                <span class="spinner-border spinner-border-sm me-2"></span>
                正在加载借阅记录...
            </div>
        </div>

        <!-- 加载失败 -->
        <div class="card border-0 shadow-sm d-none" id="errorState">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle display-4 d-block mb-3 text-danger opacity-75"></i>
                <p class="mb-2 text-secondary" id="errorMsg">加载失败</p>
                <button type="button" class="btn btn-sm btn-outline-primary" id="btnRetry">
                    <i class="bi bi-arrow-clockwise me-1"></i> 重新加载
                </button>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="card border-0 shadow-sm d-none" id="emptyState">
            <div class="card-body text-center py-5 text-secondary">
                <i class="bi bi-inbox display-4 d-block mb-3 opacity-50"></i>
                <p class="mb-1">暂无借阅记录</p>
                <p class="small mb-0">点击右上角"新增借阅"开始登记</p>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="card border-0 shadow-sm d-none" id="tableCard">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 borrow-table" id="borrowTable">
                    <thead class="table-light">
                    <tr>
                        <th class="col-id">借阅ID</th>
                        <th>书名</th>
                        <th>借阅人</th>
                        <th class="col-date">借出日期</th>
                        <th class="col-date">应还日期</th>
                        <th class="col-date">归还日期</th>
                        <th class="col-status">状态</th>
                        <th class="col-actions text-end">操作</th>
                    </tr>
                    </thead>
                    <tbody id="borrowTbody">
                    <!-- 由 borrows.js 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 搜索无结果 -->
        <div id="noResult" class="text-center text-secondary py-4 d-none">
            <i class="bi bi-search display-6 d-block mb-2 opacity-50"></i>
            <span class="small">没有匹配的借阅记录</span>
        </div>

    </main>

    <footer class="dashboard-footer">
        © <span id="year"></span> <strong>serendipity</strong> · 保留所有权利 · 解释权归 serendipity 所有
    </footer>
</div>

<!-- ===== 新增 / 编辑 弹窗 ===== -->
<div class="modal fade" id="borrowModal" tabindex="-1" aria-labelledby="borrowModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="borrowForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="borrowModalTitle">新增借阅</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">

                    <!-- 编辑时携带；新增时为空 -->
                    <input type="hidden" name="borrowId" id="fieldBorrowId">

                    <div class="mb-3">
                        <label class="form-label">书名 <span class="text-danger">*</span></label>
                        <input type="text" name="title" id="fieldTitle" class="form-control" required
                               placeholder="请输入书名">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">借阅人 <span class="text-danger">*</span></label>
                        <input type="text" name="borrower" id="fieldBorrower" class="form-control" required
                               placeholder="请输入借阅人姓名">
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">借出日期</label>
                            <input type="date" name="borrowDate" id="fieldBorrowDate" class="form-control">
                        </div>
                        <div class="col-6">
                            <label class="form-label">应还日期</label>
                            <input type="date" name="dueDate" id="fieldDueDate" class="form-control">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">归还日期</label>
                        <input type="date" name="returnDate" id="fieldReturnDate" class="form-control">
                        <div class="form-text">归还时填写；未归还请留空（状态自动计算）</div>
                    </div>

                    <div id="modalMsg" class="small mt-3 d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveBorrow">
                        <i class="bi bi-check-lg me-1"></i> 保存
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
