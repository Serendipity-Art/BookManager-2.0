<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 · serendipity 图书管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 静态资源：对应 webapp/static/css/dashboard.css -->
    <link rel="stylesheet" th:href="@{/static/css/dashboard.css}">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 静态资源：对应 webapp/static/js/dashboard.js -->
    <script defer th:src="@{/static/js/dashboard.js}"></script>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-book-half"></i>
        <span>serendipity</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-link active"><i class="bi bi-speedometer2"></i> 仪表盘</a>
        <a th:href="@{/books}" class="nav-link"><i class="bi bi-journal-bookmark"></i> 图书管理</a>
        <a th:href="@{/borrows}" class="nav-link"><i class="bi bi-arrow-left-right"></i> 借阅记录</a>
        <a th:href="@{/users}" class="nav-link"><i class="bi bi-people"></i> 用户管理</a>
        <a th:href="@{/settings}" class="nav-link"><i class="bi bi-gear"></i> 系统设置</a>
    </nav>
</aside>

<div class="main-wrapper" id="mainWrapper">
    <header class="topbar">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <div class="ms-auto d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary position-relative">
                <i class="bi bi-bell"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
            </button>
            <div class="dropdown">
                <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="${user != null ? user.username : '管理员'}">管理员</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/settings}">个人设置</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" th:href="@{/logout}">退出登录</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1">仪表盘</h4>
                <p class="text-secondary small mb-0">
                    欢迎回来，<span th:text="${user != null ? user.username : '管理员'}">管理员</span>
                </p>
            </div>
            <span class="text-secondary small" id="todayDate"></span>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-journal-bookmark"></i></div>
                    <div><div class="stat-value">1,286</div><div class="stat-label">图书总数</div></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-success-subtle text-success"><i class="bi bi-arrow-left-right"></i></div>
                    <div><div class="stat-value">87</div><div class="stat-label">在借数量</div></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-warning-subtle text-warning"><i class="bi bi-people"></i></div>
                    <div><div class="stat-value">342</div><div class="stat-label">注册用户</div></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-danger-subtle text-danger"><i class="bi bi-exclamation-triangle"></i></div>
                    <div><div class="stat-value">5</div><div class="stat-label">逾期未还</div></div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body text-center py-5 text-secondary">
                <i class="bi bi-bar-chart-line display-4 d-block mb-3 opacity-50"></i>
                <p class="mb-1">图表区域</p>
                <p class="small mb-0">后续可在这里接入借阅趋势图、分类统计等</p>
            </div>
        </div>
    </main>

    <footer class="dashboard-footer">
        © <span id="year"></span> <strong>serendipity</strong> · 保留所有权利 · 解释权归 serendipity 所有
    </footer>
</div>

</body>
</html>
