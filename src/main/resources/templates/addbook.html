<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增图书 · serendipity 图书管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/static/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/static/css/books.css}">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer th:src="@{/static/js/dashboard.js}"></script>
    <script defer th:src="@{/static/js/addbook.js}"></script>
</head>
<body>

<div class="main-wrapper">
    <main class="content">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h4 class="mb-1">新增图书</h4>
                <p class="text-secondary small mb-0">填写图书信息后保存</p>
            </div>
            <a th:href="@{books/new}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> 返回列表
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form id="bookForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label">书名 <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" required
                               placeholder="请输入书名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">作者</label>
                        <input type="text" name="author" class="form-control"
                               placeholder="请输入作者">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">价格</label>
                        <input type="number" name="price" class="form-control"
                               step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">简介</label>
                        <textarea name="description" class="form-control" rows="4"
                                  placeholder="请输入简介"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="btnSubmit">
                            <i class="bi bi-check-lg me-1"></i> 保存
                        </button>
                        <a th:href="@{/books}" class="btn btn-secondary">取消</a>
                    </div>

                    <div id="formMsg" class="small mt-3 d-none"></div>
                </form>
            </div>
        </div>

    </main>

    <footer class="dashboard-footer">
        © <span id="year"></span> <strong>serendipity</strong> · 保留所有权利
    </footer>
</div>

</body>
</html>
